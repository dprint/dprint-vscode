# GENERATED BY ./ci.ts -- DO NOT DIRECTLY EDIT

name: CI
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
jobs:
  build:
    name: 'build (${{ matrix.os }})'
    runs-on: '${{ matrix.os }}'
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npx tsc -p . --noEmit
      - name: Build
        run: npm run compile
      - name: Unit tests
        run: 'npm run test:unit'
      - name: Check formatting
        uses: dprint/check@7dc032d8874778fc024f6f9b4a7e6d896782c330 # v2.5
        if: matrix.os == 'ubuntu-latest'
      - name: Install Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        if: matrix.os == 'ubuntu-latest'
      - name: Lint CI generation
        if: matrix.os == 'ubuntu-latest'
        run: |-
          deno run -A --no-lock .github/workflows/ci.ts --lint
          deno run -A --no-lock .github/workflows/publish.ts --lint
