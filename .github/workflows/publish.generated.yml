# GENERATED BY ./publish.ts -- DO NOT DIRECTLY EDIT

name: publish
on:
  workflow_dispatch: {}
  push:
    tags:
      - '*.*.*'
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    environment: publish
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify tag matches package.json version
        run: |-
          VERSION=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the package.json version $VERSION."
            exit 1
          fi
      - name: Package
        run: npx vsce package --out dprint.vsix
      - name: Azure login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: '${{ vars.AZURE_CLIENT_ID }}'
          tenant-id: '${{ vars.AZURE_TENANT_ID }}'
          allow-no-subscriptions: true
      - name: Publish to the VS Code Marketplace
        run: npx vsce publish --packagePath dprint.vsix --azure-credential
      - name: Publish to Open VSX
        run: npx ovsx publish dprint.vsix --trusted-publishing
