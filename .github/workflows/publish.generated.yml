# GENERATED BY ./publish.ts -- DO NOT DIRECTLY EDIT

name: publish
on:
  workflow_dispatch: {}
  push:
    tags:
      - '*.*.*'
permissions:
  contents: read
jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify tag matches package.json version
        run: |-
          VERSION=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the package.json version $VERSION."
            exit 1
          fi
      - name: Package
        run: npx vsce package --out dprint.vsix
      - name: Publish to the VS Code Marketplace
        env:
          VSCE_PAT: '${{ secrets.VSCE_PAT }}'
        run: npx vsce publish --packagePath dprint.vsix
      - name: Publish to Open VSX
        env:
          OVSX_PAT: '${{ secrets.OVSX_PAT }}'
        run: npx ovsx publish dprint.vsix
