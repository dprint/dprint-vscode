name: publish
on:
  workflow_dispatch: {}
  push:
    tags:
      - "*.*.*"
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify tag matches package.json version
        run: |-
          VERSION=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the package.json version $VERSION."
            exit 1
          fi
      - name: Package
        run: npx vsce package --no-dependencies --out dprint.vsix
      - name: Upload artifact vsix
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: vsix
          path: dprint.vsix
          retention-days: 7
  marketplace:
    name: publish to the VS Code Marketplace
    needs:
      - package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: publish
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Download artifact vsix
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: vsix
          path: .
      - name: Azure login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: "${{ vars.AZURE_CLIENT_ID }}"
          tenant-id: "${{ vars.AZURE_TENANT_ID }}"
          allow-no-subscriptions: true
      - name: Publish
        run: npx vsce publish --packagePath dprint.vsix --azure-credential
  open-vsx:
    name: publish to Open VSX
    needs:
